name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build, Migrate & Test
    runs-on: ubuntu-latest

    # Service containers run alongside your steps
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dividr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install templ
      run: go install github.com/a-h/templ/cmd/templ@latest

    - name: Install sqlc
      run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

    # 1. Generate code (Templ + SQLC) to ensure no syntax errors
    - name: Generate Code
      run: |
        templ generate
        make sqlc

    # 2. Verify Generation (Ensures you didn't forget to commit generated files)
    - name: Verify Generation is Committed
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "[ERROR]: Generated files (Templ/SQLC) have uncommitted changes."
          exit 1
        fi

    # 3. Run Tests
    # We REMOVED the manual 'migrate' step. The Go tests will handle it now.
    - name: Run Integration Tests
      env:
        # Construct the Connection String explicitly for the tests
        DATABASE_URL: "postgres://user:password@localhost:5432/dividr?sslmode=disable"
        APP_ENV: test
      run: go test -v ./...
