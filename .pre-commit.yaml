repos:
  - repo: https://github.com/pre-commit/mirrors-golangci-lint
    rev: v1.59.0
    hooks:
      - id: golangci-lint
        args: [ "run", "./..." ]

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.1.7
    hooks:
      - id: go-fmt
      - id: go-vet
      
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace