repos:
  # Secrets Detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Go-specific hooks
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.7.2
    hooks:
      - id: golangci-lint
        args: ["--timeout=5m", "./cmd/...", "./internal/..."]

  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-fmt
      - id: go-mod-tidy
      - id: go-build-mod

  # Custom local hooks
  - repo: local
    hooks:
      - id: go-vet-all
        name: go-vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        files: \.go$

      - id: block-secrets-folder
        name: Block docker/secrets/ directory
        entry: bash -c 'if git diff --cached --name-only | grep -q "^docker/secrets/"; then echo "ERROR - Files in docker/secrets/ should never be committed!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      - id: block-test-data
        name: Block test data files
        entry: bash -c 'if git diff --cached --name-only | grep -qE "^docs/.*\.json$"; then echo "ERROR - Test data files in docs/ should never be committed!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

  # General file quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    - id: check-yaml
    - id: check-json
    - id: check-merge-conflict
    - id: detect-private-key
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-added-large-files
      args: ['--maxkb=1000']
    - id: no-commit-to-branch
      args: ['--branch', 'main']
